[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-thermal"
dynamic = ["version"]
description = "Thermal design evaluation for power semiconductors: plate-fin heat-sink correlations, shared-sink thermal networks, electrothermal iteration, cooling-concept comparison and Stage A Pareto screening (SI units, analytical)."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0 AND MIT"
license-files = ["LICENSE.md", "LICENSE-MIT.md", "LICENSES.md"]
authors = [{name = "Fulong Li"}]
keywords = ["power electronics", "thermal design", "heat sink", "plate fin", "natural convection", "forced convection",
            "cold plate", "thermal network", "electrothermal", "Pareto optimisation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
aipe-thermal = "aipe_thermal.cli:main"

[project.urls]
Repository = "https://github.com/FulongLi/AIPE-Thermal-Design"
Changelog = "https://github.com/FulongLi/AIPE-Thermal-Design/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aipe_thermal._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
  "slow: full seeded Stage A reproduction (about 20 s); runs by default, deselect with -m 'not slow'",
]
